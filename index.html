<!DOCTYPE html>
<html>
  <head>
  Pagani Vs Traffic
  <link rel="stylesheet" href="style.css">
  </head>

      <div class="scheletro gioco">

          </div>
          </div>
              <div class="quadro kmh">

              </div>
              </div>
                  <div class="quadro marcia">
                  <span id="marciainnestata">N</span>
                  </div>
          </div>
        </div>
    </body>
</html>
